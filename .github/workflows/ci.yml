name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore BuchstabenOS.slnx

    - name: Build Solution
      run: dotnet build BuchstabenOS.slnx -c Release --no-restore

    - name: Run Domain Unit Tests
      run: dotnet test tests/BuchstabenOS.Domain.Tests/BuchstabenOS.Domain.Tests.csproj -c Release --no-build --verbosity normal
