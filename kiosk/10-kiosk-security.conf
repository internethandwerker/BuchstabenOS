# ==============================================================================
# BuchstabenOS Kiosk Sicherheit für X11
# Deaktiviert TTY-Umschaltung (Ctrl+Alt+F1..F6) und den X-Server-Kill (Ctrl+Alt+Backspace)
# ==============================================================================
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection
